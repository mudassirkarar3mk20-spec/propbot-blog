<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropBot</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef } = React;

    const SCENARIOS = [
      { id: "maintenance", label: "🔧 Maintenance Request", color: "#F97316" },
      { id: "late_rent", label: "💰 Late Rent", color: "#EF4444" },
      { id: "lease_question", label: "📋 Lease Question", color: "#3B82F6" },
      { id: "noise_complaint", label: "🔊 Noise Complaint", color: "#8B5CF6" },
      { id: "move_out", label: "📦 Move-Out Notice", color: "#10B981" },
      { id: "renewal", label: "🔄 Lease Renewal", color: "#F59E0B" },
      { id: "deposit", label: "🏦 Security Deposit", color: "#06B6D4" },
      { id: "general", label: "✉️ General Inquiry", color: "#6B7280" },
    ];

    const TONES = [
      { id: "professional", label: "Professional" },
      { id: "firm", label: "Firm & Direct" },
      { id: "friendly", label: "Warm & Friendly" },
      { id: "legal", label: "Legal / Formal" },
    ];

    const SYSTEM_PROMPT = `You are PropBot, an expert AI assistant for independent residential property managers and landlords managing between 10–50 units.

Your job is to draft professional, legally-aware, empathetic tenant communication replies. You understand landlord-tenant dynamics, fair housing laws, and property management best practices.

RULES:
- Always be professional and measured, never aggressive or emotionally reactive
- Protect the landlord's legal position without being threatening
- Be specific and actionable — give clear next steps
- Keep replies between 80–180 words unless the situation requires more
- Never make promises about specific repair timelines unless instructed
- For maintenance: acknowledge, give timeframe, log it
- For late rent: be firm but fair, reference lease terms, give cure period
- For legal matters: recommend professional legal counsel for complex issues
- Sign off as "The Management Team" unless told otherwise

Output ONLY the reply text — no preamble, no explanation, no extra commentary. Just the draft reply, ready to send.`;

    function PropBot() {
      const [scenario, setScenario] = useState("maintenance");
      const [tone, setTone] = useState("professional");
      const [tenantMessage, setTenantMessage] = useState("");
      const [context, setContext] = useState("");
      const [reply, setReply] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [copied, setCopied] = useState(false);

      const selectedScenario = SCENARIOS.find(s => s.id === scenario);

      async function generateReply() {
        if (!tenantMessage.trim()) {
          setError("Paste the tenant's message first.");
          return;
        }
        setError("");
        setLoading(true);
        setReply("");

        try {
          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 1000,
              system: SYSTEM_PROMPT,
              messages: [{
                role: "user",
                content: `SCENARIO: ${selectedScenario.label}\nTONE: ${TONES.find(t => t.id === tone).label}\nPROPERTY CONTEXT: ${context || "Residential rental property"}\nTENANT MESSAGE: "${tenantMessage}"\n\nDraft a ${TONES.find(t => t.id === tone).label} reply.`
              }]
            })
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error.message);
          setReply(data.content.map(c => c.text || "").join(""));
        } catch (err) {
          setError("Error: " + err.message);
        } finally {
          setLoading(false);
        }
      }

      return (
        <div style={{ minHeight: "100vh", background: "#0D1117", color: "#E6EDF3", fontFamily: "Courier New, monospace" }}>
          <header style={{ borderBottom: "1px solid #21262D", padding: "0 24px", display: "flex", alignItems: "center", height: "56px", background: "#161B22" }}>
            <span style={{ fontWeight: "bold", fontSize: "15px" }}>🏠 PropBot</span>
          </header>

          <div style={{ display: "flex", minHeight: "calc(100vh - 56px)" }}>
            <aside style={{ width: "220px", borderRight: "1px solid #21262D", background: "#161B22", padding: "20px 0" }}>
              <div style={{ padding: "0 16px 12px", fontSize: "9px", color: "#484F58" }}>SCENARIO</div>
              {SCENARIOS.map(s => (
                <button key={s.id} onClick={() => setScenario(s.id)} style={{
                  width: "100%", textAlign: "left", padding: "9px 16px",
                  background: scenario === s.id ? "#21262D" : "transparent",
                  border: "none", borderLeft: scenario === s.id ? `3px solid ${s.color}` : "3px solid transparent",
                  color: scenario === s.id ? "#E6EDF3" : "#8B949E", cursor: "pointer", fontSize: "12px"
                }}>{s.label}</button>
              ))}
              <div style={{ padding: "20px 16px 12px", fontSize: "9px", color: "#484F58" }}>TONE</div>
              {TONES.map(t => (
                <button key={t.id} onClick={() => setTone(t.id)} style={{
                  width: "100%", textAlign: "left", padding: "9px 16px",
                  background: tone === t.id ? "#21262D" : "transparent",
                  border: "none", borderLeft: tone === t.id ? `3px solid #58A6FF` : "3px solid transparent",
                  color: tone === t.id ? "#58A6FF" : "#8B949E", cursor: "pointer", fontSize: "12px"
                }}>{t.label}</button>
              ))}
            </aside>

            <main style={{ flex: 1, padding: "28px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: "20px" }}>
              <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                <div style={{ background: "#161B22", border: "1px solid #21262D", borderRadius: "8px" }}>
                  <div style={{ padding: "10px 16px", borderBottom: "1px solid #21262D", fontSize: "10px", color: "#8B949E" }}>TENANT MESSAGE</div>
                  <textarea value={tenantMessage} onChange={e => setTenantMessage(e.target.value)}
                    placeholder="Paste the tenant's message here..."
                    style={{
                      width: "100%", minHeight: "180px", background: "transparent", border: "none",
                      color: "#E6EDF3", fontSize: "13px", padding: "14px 16px", outline: "none", fontFamily: "Courier New, monospace"
                    }}
                  />
                </div>
                <div style={{ background: "#161B22", border: "1px solid #21262D", borderRadius: "8px" }}>
                  <div style={{ padding: "10px 16px", borderBottom: "1px solid #21262D", fontSize: "10px", color: "#8B949E" }}>CONTEXT (optional)</div>
                  <input value={context} onChange={e => setContext(e.target.value)} placeholder="e.g. Unit 4B, 2BR apartment, tenant since 2022"
                    style={{
                      width: "100%", background: "transparent", border: "none", color: "#E6EDF3", fontSize: "12px", padding: "12px 16px", outline: "none", fontFamily: "Courier New, monospace"
                    }}
                  />
                </div>
                {error && <div style={{ background: "#FF000011", border: "1px solid #FF000044", color: "#FF7B72", padding: "10px 14px", borderRadius: "6px" }}>⚠️ {error}</div>}
                <button onClick={generateReply} disabled={loading} style={{
                  padding: "13px", background: loading ? "#21262D" : "linear-gradient(135deg, #F97316, #EF4444)",
                  border: "none", borderRadius: "8px", color: loading ? "#8B949E" : "#fff",
                  fontSize: "12px", fontWeight: "bold", cursor: loading ? "not-allowed" : "pointer", fontFamily: "Courier New, monospace"
                }}>
                  {loading ? "GENERATING..." : "⚡ DRAFT REPLY"}
                </button>
              </div>

              <div style={{ background: "#161B22", border: "1px solid #21262D", borderRadius: "8px", display: "flex", flexDirection: "column" }}>
                <div style={{ padding: "10px 16px", borderBottom: "1px solid #21262D", display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: "10px", color: "#8B949E" }}>
                  AI DRAFT REPLY
                  {reply && <button onClick={() => { navigator.clipboard.writeText(reply); setCopied(true); setTimeout(() => setCopied(false), 2000); }} style={{
                    background: copied ? "#1F6FEB22" : "transparent", border: `1px solid ${copied ? "#1F6FEB" : "#30363D"}`,
                    color: copied ? "#58A6FF" : "#8B949E", fontSize: "9px", padding: "3px 10px", borderRadius: "4px", cursor: "pointer"
                  }}>{copied ? "✓ COPIED" : "COPY"}</button>}
                </div>
                <div style={{ flex: 1, padding: "16px", minHeight: "280px", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  {loading && <div style={{ textAlign: "center" }}><div style={{ fontSize: "32px", marginBottom: "12px" }}>⏳</div><div style={{ color: "#8B949E" }}>DRAFTING...</div></div>}
                  {!loading && !reply && <div style={{ textAlign: "center", opacity: 0.4 }}><div style={{ fontSize: "32px", marginBottom: "12px" }}>✉️</div><div style={{ color: "#8B949E" }}>YOUR REPLY WILL APPEAR HERE</div></div>}
                  {reply && <div style={{ fontSize: "13px", lineHeight: "1.8", color: "#E6EDF3", whiteSpace: "pre-wrap", wordBreak: "break-word" }}>{reply}</div>}
                </div>
              </div>
            </main>
          </div>

          <style>{`
            * { box-sizing: border-box; }
            textarea::placeholder { color: #484F58; }
            input::placeholder { color: #484F58; }
          `}</style>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PropBot />);
  </script>
</body>
</html>
